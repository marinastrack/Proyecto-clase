<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cuestionarios</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 40px; }
        h1 { color: #1e293b; text-align: center; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; max-width: 1000px; margin: 40px auto; 
        }
        .card { 
            background: white; padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: transform 0.2s; text-decoration: none; color: inherit;
            display: flex; flex-direction: column; align-items: center;
        }
        .card:hover { transform: translateY(-5px); border-left: 5px solid var(--primary); }
        .card i { font-size: 2rem; margin-bottom: 10px; }
        .tag { font-size: 0.8rem; background: #dbeafe; color: var(--primary); padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>📚 Mis Cuestionarios Interactivos</h1>

    <div class="grid">
        <a href="cuestionarios/unidad1.html" class="card">
            <span class="tag">Semana 1</span>
            <h3>Introducción a HTML</h3>
            <p>Conceptos básicos y etiquetas.</p>
        </a>

        <a href="cuestionarios/unidad2.html" class="card">
            <span class="tag">Semana 2</span>
            <h3>Estilos con CSS</h3>
            <p>Selectores, colores y cajas.</p>
        </a>

        <a href="cuestionarios/js-basico.html" class="card">
            <span class="tag">Semana 3</span>
            <h3>Lógica con JS</h3>
            <p>Variables y funciones.</p>
        </a>
    </div>

</body>
</html>
