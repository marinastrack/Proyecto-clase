<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío de Límites - ET N°16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="app" class="max-w-2xl mx-auto py-12 px-4">
        </div>

    <script>
        const quizData = [
            {
                question: "1. Calcula el siguiente límite por reemplazo directo: lim x→3 (2x + 5).",
                hint: "Sustituye el valor de x directamente en la expresión.",
                options: [
                    { text: "11", isCorrect: true, rationale: "Correcto. 2(3) + 5 = 6 + 5 = 11." },
                    { text: "8", isCorrect: false, rationale: "Revisa la multiplicación por 2." },
                    { text: "1", isCorrect: false, rationale: "Parece que restaste en lugar de sumar." }
                ]
            },
            {
                question: "2. ¿Qué obtenemos inicialmente al evaluar lim x→2 (x² - 4)/(x - 2) por reemplazo directo?",
                hint: "Evalúa numerador y denominador por separado.",
                options: [
                    { text: "0/0", isCorrect: true, rationale: "Exacto. Es una indeterminación que requiere factoreo." },
                    { text: "4", isCorrect: false, rationale: "Ese es el resultado final tras factorizar, no el inicial." },
                    { text: "No existe", isCorrect: false, rationale: "0/0 no significa que no exista, sino que está oculto." }
                ]
            },
            {
                question: "3. En GESTIÓN (GADO): Si un costo tiende a 0/0 en un punto crítico, ¿qué significa?",
                hint: "El límite ayuda a predecir comportamientos en fallas de sistema.",
                options: [
                    { text: "Hay una tendencia predecible a pesar de la falla puntual.", isCorrect: true, rationale: "¡Bien! El límite nos permite proyectar el valor justo en ese 'agujero'." },
                    { text: "El costo es cero.", isCorrect: false, rationale: "No se puede concluir eso sin salvar la indeterminación." },
                    { text: "Los datos son erróneos.", isCorrect: false, rationale: "Son datos valiosos que requieren análisis algebraico." }
                ]
            },
            {
                question: "4. ¿Qué caso de factoreo usarías para resolver lim x→5 (x² - 25)/(x - 5)?",
                hint: "Observa la resta de dos cuadrados perfectos.",
                options: [
                    { text: "Diferencia de Cuadrados", isCorrect: true, rationale: "Perfecto. (x-5)(x+5) permite simplificar la expresión." },
                    { text: "Factor Común", isCorrect: false, rationale: "No hay un término que se repita en ambos." },
                    { text: "Trinomio", isCorrect: false, rationale: "Solo tenemos dos términos en el numerador." }
                ]
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;

        function render() {
            const app = document.getElementById('app');
            if (currentQuestion >= quizData.length) {
                renderResult();
                return;
            }

            const data = quizData[currentQuestion];
            const progress = ((currentQuestion + 1) / quizData.length) * 100;

            app.innerHTML = `
                <div class="mb-8 flex justify-between items-end">
                    <div>
                        <h1 class="text-2xl font-bold text-blue-900 tracking-tight">Unidad 1: Límites</h1>
                        <p class="text-slate-500 text-sm">4to Año - ET N°16 España</p>
                    </div>
                    <div class="text-right">
                        <div class="w-32 h-2 bg-slate-200 rounded-full overflow-hidden mb-1">
                            <div class="h-full bg-blue-600 transition-all duration-500" style="width: ${progress}%"></div>
                        </div>
                        <span class="text-xs text-slate-400 font-bold uppercase">Pregunta ${currentQuestion + 1} de ${quizData.length}</span>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in">
                    <div class="p-8">
                        <h2 class="text-xl font-semibold mb-8 text-slate-800 leading-relaxed">${data.question}</h2>
                        
                        <div class="space-y-3">
                            ${data.options.map((opt, i) => `
                                <button onclick="selectOption(${i})" ${selectedOption !== null ? 'disabled' : ''} 
                                    class="w-full text-left p-5 rounded-2xl border-2 transition-all flex items-center justify-between
                                    ${getButtonStyle(i)}">
                                    <span class="font-medium">${opt.text}</span>
                                    ${getIcon(i)}
                                </button>
                            `).join('')}
                        </div>

                        ${selectedOption !== null ? `
                            <div class="mt-8 p-6 rounded-2xl animate-fade-in ${data.options[selectedOption].isCorrect ? 'bg-emerald-50 text-emerald-900' : 'bg-rose-50 text-rose-900'}">
                                <p class="text-sm leading-relaxed">${data.options[selectedOption].rationale}</p>
                            </div>
                        ` : ''}
                    </div>

                    <div class="bg-slate-50 p-6 flex justify-between border-t border-slate-100">
                        <button onclick="window.location.href='../index.html'" class="text-slate-400 hover:text-slate-600 font-medium flex items-center gap-2">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> Salir
                        </button>
                        <button onclick="nextQuestion()" ${selectedOption === null ? 'disabled' : ''} 
                            class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold disabled:opacity-50 hover:bg-blue-700 transition-all flex items-center gap-2">
                            ${currentQuestion === quizData.length - 1 ? 'Ver Resultado' : 'Siguiente'} <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function getButtonStyle(i) {
            if (selectedOption === null) return "border-slate-100 hover:border-blue-300 hover:bg-blue-50";
            if (i === selectedOption) {
                return quizData[currentQuestion].options[i].isCorrect ? "border-emerald-500 bg-emerald-50" : "border-rose-500 bg-rose-50";
            }
            if (quizData[currentQuestion].options[i].isCorrect) return "border-emerald-500 opacity-60";
            return "opacity-40 border-slate-50 cursor-default";
        }

        function getIcon(i) {
            if (selectedOption === null) return '';
            if (quizData[currentQuestion].options[i].isCorrect) return '<i data-lucide="check-circle-2" class="text-emerald-500 w-6 h-6"></i>';
            if (i === selectedOption) return '<i data-lucide="x-circle" class="text-rose-500 w-6 h-6"></i>';
            return '';
        }

        function selectOption(i) {
            selectedOption = i;
            if (quizData[currentQuestion].options[i].isCorrect) score++;
            render();
        }

        function nextQuestion() {
            currentQuestion++;
            selectedOption = null;
            render();
        }

        function renderResult() {
            const app = document.getElementById('app');
            const pct = Math.round((score / quizData.length) * 100);
            app.innerHTML = `
                <div class="bg-white rounded-3xl shadow-xl p-12 text-center animate-fade-in border border-slate-100">
                    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-8">
                        <i data-lucide="award" class="text-blue-600 w-10 h-10"></i>
                    </div>
                    <h2 class="text-3xl font-bold mb-2">¡Práctica Terminada!</h2>
                    <p class="text-slate-500 mb-8">Has completado el taller de la Unidad 1</p>
                    <div class="bg-slate-50 rounded-2xl p-8 mb-8">
                        <div class="text-6xl font-black text-blue-600 mb-2">${pct}%</div>
                        <p class="text-slate-400 font-bold uppercase tracking-widest text-xs">Puntaje: ${score} de ${quizData.length}</p>
                    </div>
                    <button onclick="window.location.href='../index.html'" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition-all">
                        Volver al Portal Principal
                    </button>
                </div>
            `;
            lucide.createIcons();
        }

        window.onload = render;
    </script>
</body>
</html>
