<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío de Límites - ET N°16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="app" class="max-w-2xl mx-auto py-12 px-4"></div>

    <script>
        const quizData = [
            {
                question: "1. Calcula el siguiente límite por reemplazo directo: lim x→3 (2x + 5).",
                options: [
                    { text: "11", isCorrect: true, rationale: "Correcto. 2(3) + 5 = 6 + 5 = 11." },
                    { text: "8", isCorrect: false, rationale: "Revisa la multiplicación por 2." },
                    { text: "1", isCorrect: false, rationale: "Sustitución incorrecta." }
                ]
            },
            {
                question: "2. ¿Qué obtenemos inicialmente al evaluar lim x→2 (x² - 4)/(x - 2)?",
                options: [
                    { text: "0/0", isCorrect: true, rationale: "Exacto. Es una indeterminación que requiere salvarse." },
                    { text: "4", isCorrect: false, rationale: "Ese es el resultado final, no el inicial." },
                    { text: "No existe", isCorrect: false, rationale: "0/0 indica que hay que investigar más." }
                ]
            },
            {
                question: "3. En GESTIÓN: Si un costo tiende a 0/0 en un punto crítico, ¿qué significa el límite?",
                options: [
                    { text: "Hay una tendencia predecible a pesar de la falla.", isCorrect: true, rationale: "El límite predice el comportamiento donde la función no está definida." },
                    { text: "El costo es inexistente.", isCorrect: false, rationale: "No, el límite puede darnos un valor finito." },
                    { text: "Error de carga.", isCorrect: false, rationale: "Es una característica matemática del modelo." }
                ]
            },
            {
                question: "4. ¿Qué caso de factoreo usarías para lim x→5 (x² - 25)/(x - 5)?",
                options: [
                    { text: "Diferencia de Cuadrados", isCorrect: true, rationale: "Correcto: (x-5)(x+5)." },
                    { text: "Factor Común", isCorrect: false, rationale: "No hay términos comunes en el numerador." },
                    { text: "Trinomio", isCorrect: false, rationale: "Solo hay dos términos." }
                ]
            },
            {
                question: "5. Calcula lim x→∞ (5x + 2) / (2x - 1).",
                options: [
                    { text: "5/2", isCorrect: true, rationale: "Al tender a infinito, mandan los términos de mayor grado: 5x/2x = 5/2." },
                    { text: "∞", isCorrect: false, rationale: "Como los grados son iguales, el límite es el cociente de coeficientes." },
                    { text: "0", isCorrect: false, rationale: "Solo sería 0 si el grado del denominador fuera mayor." }
                ]
            },
            {
                question: "6. Si lim x→a f(x) = L y f(a) no está definido, ¿qué hay en 'a'?",
                options: [
                    { text: "Un 'agujero' o punto evitable.", isCorrect: true, rationale: "La función se acerca a L pero no llega a tocarlo." },
                    { text: "Una asíntota vertical.", isCorrect: false, rationale: "Eso pasaría si el límite fuera infinito." },
                    { text: "Un salto infinito.", isCorrect: false, rationale: "Los límites laterales tendrían que ser distintos o infinitos." }
                ]
            },
            {
                question: "7. ¿Cuál es el límite lateral por derecha de f(x) = 1/x cuando x→0?",
                options: [
                    { text: "+∞", isCorrect: true, rationale: "Al dividir 1 por números positivos muy pequeños, el resultado crece sin cota." },
                    { text: "-∞", isCorrect: false, rationale: "Ese sería el límite por izquierda (x < 0)." },
                    { text: "0", isCorrect: false, rationale: "1 dividido algo ínfimo da algo inmenso." }
                ]
            },
            {
                question: "8. ¿Cómo se resuelve la indeterminación ∞/∞ en funciones racionales?",
                options: [
                    { text: "Dividiendo por la mayor potencia de x.", isCorrect: true, rationale: "Es la técnica estándar para ver qué término domina." },
                    { text: "Multiplicando por el conjugado.", isCorrect: false, rationale: "Esa técnica se usa para raíces." },
                    { text: "Cancelando las x directamente.", isCorrect: false, rationale: "Se debe hacer con rigor algebraico." }
                ]
            },
            {
                question: "9. Calcula lim x→0 (x² + 3x) / x.",
                options: [
                    { text: "3", isCorrect: true, rationale: "Factorizando x(x+3)/x, simplificas x y queda 0+3 = 3." },
                    { text: "0", isCorrect: false, rationale: "Olvidaste el término lineal 3x." },
                    { text: "∞", isCorrect: false, rationale: "Se puede salvar la indeterminación 0/0." }
                ]
            },
            {
                question: "10. En el análisis de una lente, si el frente de onda tiende a infinito, se dice que los rayos son:",
                options: [
                    { text: "Paralelos", isCorrect: true, rationale: "Física óptica: a distancia infinita, la curvatura es nula (rayos paralelos)." },
                    { text: "Convergentes", isCorrect: false, rationale: "Eso implicaría un límite puntual." },
                    { text: "Divergentes", isCorrect: false, rationale: "Eso implicaría un foco cercano." }
                ]
            },
            {
                question: "11. ¿Qué representa una asíntota horizontal en un modelo de costos?",
                options: [
                    { text: "El costo mínimo fijo al que tiende la producción a gran escala.", isCorrect: true, rationale: "Es el valor límite del costo unitario." },
                    { text: "Un costo que crece sin control.", isCorrect: false, rationale: "Eso sería una tendencia infinita." },
                    { text: "El punto de quiebra.", isCorrect: false, rationale: "Eso se analiza con raíces o derivadas." }
                ]
            },
            {
                question: "12. Resuelve: lim x→2 (x - 2) / (x² - 4).",
                options: [
                    { text: "1/4", isCorrect: true, rationale: "(x-2)/[(x-2)(x+2)] = 1/(x+2). Evaluando en 2 da 1/4." },
                    { text: "1/2", isCorrect: false, rationale: "Revisa la suma en el denominador (2+2)." },
                    { text: "0", isCorrect: false, rationale: "El numerador se simplifica, no queda en cero." }
                ]
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;
        let shuffledOptions = [];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function render() {
            const app = document.getElementById('app');
            if (currentQuestion >= quizData.length) {
                renderResult();
                return;
            }

            const data = quizData[currentQuestion];
            
            if (selectedOption === null) {
                shuffledOptions = shuffle([...data.options]);
            }

            const progress = ((currentQuestion + 1) / quizData.length) * 100;

            app.innerHTML = `
                <div class="mb-8 flex justify-between items-end">
                    <div>
                        <h1 class="text-2xl font-bold text-blue-900 tracking-tight">Unidad 1: Límites</h1>
                        <p class="text-slate-500 text-sm">ET N°16 - Taller Integral (12 Preguntas)</p>
                    </div>
                    <div class="text-right">
                        <div class="w-32 h-2 bg-slate-200 rounded-full overflow-hidden mb-1">
                            <div class="h-full bg-blue-600 transition-all duration-500" style="width: ${progress}%"></div>
                        </div>
                        <span class="text-xs text-slate-400 font-bold uppercase">Pregunta ${currentQuestion + 1} de ${quizData.length}</span>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in">
                    <div class="p-8">
                        <h2 class="text-xl font-semibold mb-8 text-slate-800 leading-relaxed">${data.question}</h2>
                        <div class="space-y-3">
                            ${shuffledOptions.map((opt, i) => `
                                <button onclick="selectOption(${i})" ${selectedOption !== null ? 'disabled' : ''} 
                                    class="w-full text-left p-5 rounded-2xl border-2 transition-all flex items-center justify-between
                                    ${getButtonStyle(i)}">
                                    <span class="font-medium">${opt.text}</span>
                                    ${getIcon(i)}
                                </button>
                            `).join('')}
                        </div>

                        ${selectedOption !== null ? `
                            <div class="mt-8 p-6 rounded-2xl animate-fade-in ${shuffledOptions[selectedOption].isCorrect ? 'bg-emerald-50 text-emerald-900' : 'bg-rose-50 text-rose-900'}">
                                <p class="text-sm leading-relaxed"><strong>Explicación:</strong> ${shuffledOptions[selectedOption].rationale}</p>
                            </div>
                        ` : ''}
                    </div>

                    <div class="bg-slate-50 p-6 flex justify-between border-t border-slate-100">
                        <button onclick="window.location.href='../index.html'" class="text-slate-400 hover:text-slate-600 font-medium flex items-center gap-2">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> Salir
                        </button>
                        <button onclick="nextQuestion()" ${selectedOption === null ? 'disabled' : ''} 
                            class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold disabled:opacity-50 hover:bg-blue-700 transition-all flex items-center gap-2">
                            ${currentQuestion === quizData.length - 1 ? 'Finalizar' : 'Siguiente'} <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function getButtonStyle(i) {
            if (selectedOption === null) return "border-slate-100 hover:border-blue-300 hover:bg-blue-50";
            if (i === selectedOption) {
                return shuffledOptions[i].isCorrect ? "border-emerald-500 bg-emerald-50" : "border-rose-500 bg-rose-50";
            }
            if (shuffledOptions[i].isCorrect) return "border-emerald-500 opacity-60";
            return "opacity-40 border-slate-50 cursor-default";
        }

        function getIcon(i) {
            if (selectedOption === null) return '';
            if (shuffledOptions[i].isCorrect) return '<i data-lucide="check-circle-2" class="text-emerald-500 w-6 h-6"></i>';
            if (i === selectedOption) return '<i data-lucide="x-circle" class="text-rose-500 w-6 h-6"></i>';
            return '';
        }

        function selectOption(i) {
            selectedOption = i;
            if (shuffledOptions[i].isCorrect) score++;
            render();
        }

        function nextQuestion() {
            currentQuestion++;
            selectedOption = null;
            render();
        }

        function renderResult() {
            const app = document.getElementById('app');
            const pct = Math.round((score / quizData.length) * 100);
            app.innerHTML = `
                <div class="bg-white rounded-3xl shadow-xl p-12 text-center animate-fade-in border border-slate-100">
                    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-8">
                        <i data-lucide="award" class="text-blue-600 w-10 h-10"></i>
                    </div>
                    <h2 class="text-3xl font-bold mb-2">¡Taller Finalizado!</h2>
                    <p class="text-slate-500 mb-8">Análisis Matemático 4to - ET N°16</p>
                    <div class="bg-slate-50 rounded-2xl p-8 mb-8">
                        <div class="text-6xl font-black text-blue-600 mb-2">${pct}%</div>
                        <p class="text-slate-400 font-bold uppercase tracking-widest text-xs">Aciertos: ${score} de ${quizData.length}</p>
                    </div>
                    <button onclick="window.location.href='../index.html'" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition-all">
                        Volver al Portal Principal
                    </button>
                </div>
            `;
            lucide.createIcons();
        }

        window.onload = render;
    </script>
</body>
</html>
